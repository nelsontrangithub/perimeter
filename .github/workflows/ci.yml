name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: lint, typecheck, test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: perimeter
          POSTGRES_PASSWORD: perimeter
          POSTGRES_DB: perimeter
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U perimeter"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PERIMETER_TEST_DATABASE_URL: postgresql://perimeter:perimeter@localhost:5432/perimeter
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install
        run: uv sync --all-groups
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Typecheck (mypy --strict)
        run: uv run mypy
      - name: Dependency rule (core imports stdlib only)
        run: uv run pytest tests/test_architecture.py -v
      - name: Tests
        run: uv run pytest
      - name: Security invariants (INV-1..INV-5)
        run: uv run pytest -m invariant -v

  gates:
    name: performance budget gates (50k-chunk corpus)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install
        run: uv sync --all-groups
      - name: Recall, latency, memory, index size, API-call gates
        run: make bench-gate
      - name: Results table (informational)
        run: uv run python -m bench.run --out /tmp/results.md --json /tmp/results.json

  admin:
    name: admin console (typed client, typecheck, build, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - name: Install
        run: |
          uv sync --all-groups
          cd admin && npm ci
      - name: Generated client is current
        run: make generate-client-check
      - name: Typecheck, test, build
        run: |
          cd admin
          npm run typecheck
          npm test
          npm run build
